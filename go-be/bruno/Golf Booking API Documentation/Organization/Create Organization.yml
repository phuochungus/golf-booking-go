info:
  name: Create Organization
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/v1/organization"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Test Hung3"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

